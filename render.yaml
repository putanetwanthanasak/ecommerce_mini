# Render Blueprint — the backend API.
#
# Committed so the service is reproducible instead of living only as a set of
# dashboard fields nobody can diff. Render reads this from the repo root, which
# is why rootDir points at backend/ (this is a monorepo with no root
# package.json — see CLAUDE.md "Repository layout").
#
# Secrets are NOT here. Every value below is either public or marked
# `sync: false`, which tells Render "prompt for this, do not read it from the
# repo". DATABASE_URL, DIRECT_URL and JWT_SECRET are set in the dashboard.

services:
  - type: web
    name: ecommerce-backend
    runtime: node
    plan: free
    region: singapore # nearest to the Supabase project (ap-southeast-1)
    rootDir: backend

    # npm ci, not npm install: it installs exactly what package-lock.json pins
    # and fails if the two disagree, which is what a deploy wants.
    #
    # --include=dev IS REQUIRED, and this is the non-obvious part.
    #
    # NODE_ENV=production is declared below, and Render injects env vars into the
    # BUILD as well as the runtime. npm treats NODE_ENV=production as "omit
    # devDependencies", so a plain `npm ci` here installs none of them — and this
    # is a TypeScript project whose compiler and type packages all live there.
    # The build then fails with errors that look like missing dependencies rather
    # than a missing install flag:
    #
    #   src/app.ts: error TS7016: Could not find a declaration file for module 'cors'
    #   src/index.ts: error TS2580: Cannot find name 'process'
    #
    # Reproduced from a clean checkout: without the flag `npm run build` exits 2
    # with exactly those errors; with it, it exits 0 and emits dist/.
    #
    # The failure is also partial in a way that misleads. `typescript` and
    # `prisma` survive a production install anyway, because @prisma/client
    # depends on both — so the compiler is present and only the @types/* packages
    # are missing. That is incidental to Prisma's dependency tree, not something
    # to rely on.
    #
    # The alternative was to set NODE_ENV only at runtime, but Render has no
    # build-vs-runtime scoping for envVars: the only way to get it is to drop
    # NODE_ENV from envVars and inline it into startCommand. That hides a
    # load-bearing value inside a command string, makes the dashboard show
    # NODE_ENV as unset, and src/lib/prisma.ts branches on it. Declaring it once
    # here and making the build's extra need explicit at the build is clearer.
    #
    # Type packages are deliberately NOT promoted into `dependencies` — that
    # would put build-only packages in the runtime's dependency list permanently.
    # Note that on Render's native Node runtime the build and the running service
    # share a filesystem, so devDependencies do remain on disk at runtime; they
    # are simply never imported. Appending `&& npm prune --omit=dev` would strip
    # them (verified: it leaves @prisma/client and the generated query engine
    # intact). It is left off because the win is unused disk space on a free
    # instance, while the failure mode — silently removing something the runtime
    # needs — is far worse than the problem.
    #
    # `prisma generate` must run here. The generated client is written into
    # node_modules and is NOT committed, so without this step the compiled
    # output imports a client that does not exist. It does not need DATABASE_URL
    # or DIRECT_URL (verified — it generates fine with neither set).
    #
    # Migrations are deliberately absent from the build: a build can run on a
    # branch, in parallel, or be retried, and none of those are moments to be
    # applying DDL to a live database. See the note below on where they do run.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build

    # MIGRATIONS ARE APPLIED MANUALLY — there is deliberately no
    # preDeployCommand here.
    #
    # Render rejects it outright on the free tier:
    #   services[0] pre-deploy command is not supported for free tier services
    # It is not ignored with a warning, it fails blueprint validation, so the
    # whole service cannot be created while it is present.
    #
    # Do NOT solve this by appending `npx prisma migrate deploy` to
    # buildCommand. A build runs on branches, can run concurrently with another
    # build, and is retried automatically — so DDL there can hit a live database
    # at a moment nobody chose, possibly twice at once. The build stays a pure
    # compile step.
    #
    # Instead, run migrations deliberately from a trusted machine BEFORE
    # deploying, pointing at the SESSION-mode pooler URL:
    #
    #     cd backend && DATABASE_URL="$DIRECT_URL" npx prisma migrate deploy
    #
    # DATABASE_URL is overridden on purpose: Prisma Migrate needs a
    # session-level advisory lock, which Supabase's transaction-mode pooler
    # (port 6543) cannot hold — there it hangs indefinitely rather than
    # failing. Session mode is port 5432, which is what DIRECT_URL points at.
    #
    # Always `migrate deploy`, never `migrate dev`: deploy only applies
    # committed migration files and never prompts, while dev can decide the
    # schema has drifted and offer to RESET the database.
    #
    # The schema is already current on Supabase, so nothing is pending for the
    # first deploy. This step only matters when a new migration is added.
    #
    # Upgrading off the free tier is what makes this automatable again — at
    # which point restore:
    #
    #     preDeployCommand: npx prisma migrate deploy
    #
    # which runs after a successful build and before traffic shifts, aborting
    # the deploy on a non-zero exit with the old version still serving.

    # The compiled output. Never ts-node-dev: that is the dev-only watcher, it
    # skips type checking, and it would recompile on a container with no dev
    # dependencies guaranteed to stick around.
    startCommand: npm run start

    # Render restarts the service if this stops returning 2xx.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects a PORT and expects the process to bind it. src/index.ts
      # already reads process.env.PORT, falling back to 4000 locally.
      - key: PORT
        value: 10000

      # Runtime connection: Supabase Supavisor, TRANSACTION mode (port 6543)
      # with ?pgbouncer=true. The direct db.<ref>.supabase.co host is IPv6-only
      # and Render has no outbound IPv6, so the pooler is required, not optional.
      - key: DATABASE_URL
        sync: false

      # Migrations only: Supavisor SESSION mode (port 5432). See the comment on
      # preDeployCommand and prisma/schema.prisma.
      - key: DIRECT_URL
        sync: false

      # Freshly generated for production — never the development secret. Every
      # issued token is signed with this, so changing it invalidates all of them.
      - key: JWT_SECRET
        sync: false

      # Comma-separated browser origins allowed to call this API — the Vercel
      # frontend, plus localhost so a local frontend can talk to the deployed
      # backend. Requests with no Origin (Render's health check, curl) are
      # always allowed; see src/lib/corsOptions.ts.
      - key: CORS_ORIGINS
        sync: false
