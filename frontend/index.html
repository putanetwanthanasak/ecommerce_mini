    <!--
      DIRECTION CONTRACT

      THESIS: Availability as a live board. A split-flap arrivals board exists to make a
      changing number trustworthy at a glance, and this store's stock is guaranteed by a
      transaction that cannot oversell — so the board is the medium, not a metaphor. Refuses
      the white product card with an empty image slot: no photograph is coming, and there is
      no column to put one in.

      OWN-WORLD: Dark enamelled board (#12161A) carrying matte flaps (#1E2428) split by a
      chassis hairline. Amber (#E3B23C) is reserved for a figure that can still change;
      signal green for settled, alert red for gone. Archivo variable — condensed tracked caps
      for rails and labels, tabular figures for money. Rows and rails, never cards and shadows.

      STORY: The visitor reads what a thing costs and how many are left, believes both because
      the board states them plainly and says what guarantees them, and adds one to the cart.

      FIRST VIEWPORT: Board header rail, wordmark in condensed caps left. Beneath it a column
      rail (ITEM / STOCK / PRICE) in 11px tracked caps [AMENDED], then product rows as flaps:
      name at condensed 700 [AMENDED], price right-aligned tabular at figure scale, and the
      stock COUNT printed as a tabular figure beside it — signal green when settled, amber
      below the low threshold [AMENDED]. The add control sits at each row's right edge.

      [AMENDED] = corrected AFTER the finish review, not part of the original commitment.
      Originally: "12px tracked caps", "condensed 600", and "stock in amber beside it". The
      first two were stale records of deliberate build choices. The third is the one that
      mattered: the review found the board printed no number at all and amber therefore
      reached no surface in the app, so the promise was rewritten to name the count
      explicitly. A contract quietly revised to agree with its own render stops being a
      check, which is why these three are marked instead of blended in.

      FORM: The Departures Board — candidate 1 of my grounded list, user-pinned over the
      roll's assignment (candidate 3, The Trader's Slate). Seed key 31f56913.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
