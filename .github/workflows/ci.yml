name: CI

# Any branch, plus every PR — a feature branch must be green before it is merged.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Monorepo: every `run` step below executes inside backend/, where
    # package.json, prisma/ and the test suite live. This applies to `run` only —
    # action inputs (see the npm cache path below) still resolve from the repo
    # root and have to name backend/ explicitly.
    defaults:
      run:
        working-directory: backend

    services:
      # Ephemeral Postgres for this run only. The suite never touches the
      # Supabase dev database; DATABASE_URL below points here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        # The container is up long before Postgres accepts connections. Without
        # this gate, `prisma migrate deploy` races the server and fails.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
      # prisma/schema.prisma declares directUrl = env("DIRECT_URL"), and Prisma
      # fails with P1012 if it is missing — there is no fallback to url. It only
      # needs to differ from DATABASE_URL in production, where the app runs
      # through a transaction-mode pooler that cannot hold Migrate's advisory
      # lock. This service container is a direct connection, so it is the same value.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # `defaults.run.working-directory` does not reach action inputs, so the
          # lockfile has to be named from the repo root or the cache step fails.
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Before the tests, not after: `npm run dev` uses --transpile-only and never
      # type-checks, so this is the only thing that catches a type error — and it
      # fails in seconds instead of after the whole suite has run.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  # Deliberately has no `needs:` — it runs alongside the backend job rather than
  # after it. A frontend type error and a backend test failure are independent
  # signals, and gating this on the backend would hide one behind the other.
  # No Postgres either: nothing here touches a database.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # Required, even though nothing is deployed from CI.
      #
      # src/lib/api.ts throws at module load when VITE_API_URL is unset. Vite
      # inlines the variable at build time, so with it missing the bundler can
      # prove the throw always fires, marks the rest of the app unreachable and
      # tree-shakes it away — the build then exits 0 having emitted a bundle
      # with none of the application in it. Verified: without this, every app
      # string disappears from dist/ and the bundle drops ~50 kB. The value is a
      # placeholder purely to keep the build representative.
      VITE_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # As in the backend job: action inputs don't see working-directory.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the frontend's
      # type check as well as its bundle — the equivalent of the backend's
      # separate tsc --noEmit step.
      - name: Build
        run: npm run build

  # Builds the local-dev Docker setup and proves it serves requests. Separate
  # from, and parallel to, the two jobs above: those are required status checks
  # on main and stay exactly as they are. Docker is for local development only —
  # nothing here is deployed (Render uses the native Node runtime).
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # db → migrate (one-shot, must exit 0) → backend, ordered by depends_on
      # conditions in docker-compose.yml. If migrate fails, `up` fails here.
      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Migrate exited cleanly
        run: |
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")
          echo "migrate exit code: $code"
          test "$code" = "0"

      # The backend container is "running" before Express has bound the port;
      # poll until it answers, then make the assertion that counts with -f.
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:4000/api/products?limit=1" > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become ready within 60s"
          exit 1

      - name: Smoke test
        run: curl -f "http://localhost:4000/api/products?limit=1"

      - name: Runtime image runs as non-root with no source or secrets
        run: |
          image=$(docker compose images -q backend)
          test "$(docker run --rm --entrypoint whoami "$image")" = "node"
          docker run --rm --entrypoint sh "$image" -c 'test ! -e src && test ! -e .env'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
